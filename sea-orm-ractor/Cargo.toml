[package]
authors       = ["SeaQL Contributors"]
categories    = ["database", "concurrency"]
description   = "Ractor actor integration for SeaORM — Glue #3 dispatch-tag mechanism (plan §5)"
documentation = "https://docs.rs/sea-orm-ractor"
edition       = "2024"
homepage      = "https://www.sea-ql.org/SeaORM"
keywords      = ["async", "orm", "actor", "ractor", "sea-orm"]
license       = "MIT OR Apache-2.0"
name          = "sea-orm-ractor"
repository    = "https://github.com/SeaQL/sea-orm"
rust-version  = "1.85.0"
version       = "0.1.0"

[lib]
name = "sea_orm_ractor"
path = "src/lib.rs"

# PP-13 wave-2 fix: present in parent workspace's `exclude` list, so cargo
# would otherwise refuse to compile this crate standalone. The empty
# [workspace] table marks this crate as its own workspace root.
[workspace]

[dependencies]
# Path dep to the root sea-orm crate; exact pinning deferred to consolidation sprint.
sea-orm  = { version = "2.0.0-rc", path = "../", default-features = false }
# Actor framework — version pinned loosely; tighten in Sprint 2 once ractor releases 0.x stable.
ractor     = "*"
once_cell  = "*"
thiserror  = "*"

# Temporary workspace declaration for standalone cargo check during Sprint 1.
# The orchestrator will remove this and add sea-orm-ractor to the root workspace.members.
